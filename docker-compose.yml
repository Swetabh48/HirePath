version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calorieapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/calorieapp?schema=public
      JWT_SECRET: dev_secret_change_me
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FOOD_DB_API_KEY: ${FOOD_DB_API_KEY}
      PORT: 4000
      NODE_ENV: development
    depends_on:
      - db
    ports:
      - "4000:4000"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"
volumes:
  pgdata:
